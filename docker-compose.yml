services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rootiq
      POSTGRES_PASSWORD: rootiq
      POSTGRES_DB: rootiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootiq"]
      interval: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      TOPOLOGY_PATH: /app/configs/topology.json
      LAYOUT_PATH: /app/configs/layout.json
      DATABASE_URL: postgresql+psycopg://rootiq:rootiq@db:5432/rootiq
      ROOTIQ_MODE: sim
    ports:
      - "8000:8000"
    volumes:
      - "./configs:/app/configs"
      - "./data:/app/data"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  pgdata: {}
